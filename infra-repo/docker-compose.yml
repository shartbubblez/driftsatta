services:
  # =============================================================
  # LASTBALANSERARE
  # =============================================================
  # TODO: Konfigurera lastbalanseraren
  # - Bygg från ./loadbalancer
  # - Exponera port 80 till hosten
  # - Containern behöver NET_ADMIN capability för nftables
  # - Aktivera IP-forwarding via sysctls
  # - Anslut till frontend-nätverket med statisk IP 172.20.0.10
  # =============================================================
  loadbalancer:
    build: ./loadbalancer
    container_name: loadbalancer
    ports:
     - "80:80"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      frontend:
        ipv4_address: 172.20.0.10
    # TODO: Lägg till ports, cap_add, sysctls, networks                        CHECK  
    depends_on:
      - app1
      - app2

  # =============================================================
  # APPLIKATIONSINSTANSER
  # =============================================================
  # TODO: Konfigurera två appinstanser (app1 och app2)
  # - Bygg från ../app-repo/app
  # - Sätt miljövariabler för databasanslutning
  #   (DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME)
  # - Anslut till BÅDE frontend och backend-nätverk
  # - Ge statiska IP-adresser på frontend-nätverket
  #   (app1: 172.20.0.11, app2: 172.20.0.12)
  # - Vänta på att MariaDB är healthy innan start
  # =============================================================
  app1:
    build: ../app-repo/app
    container_name: app1
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: kabelkramarna123
      DB_NAME: app_db
    networks:
      frontend:
        ipv4_address: 172.20.0.11
      backend: {}
    depends_on:
      mariadb:
        condition: service_healthy
    # TODO: Lägg till environment, networks, depends_on                           CHECK

  app2:
    build: ../app-repo/app
    container_name: app2
    environment:
      DB_HOST: mariadb
      DP_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: kabelkramarna123
      DB_NAME: app_db
    networks:
      frontend:
        ipv4_address: 172.20.0.12
      backend: {}
    depends_on:
      mariadb:
        condition: service_healthy
    # TODO: Lägg till environment, networks, depends_on                          CHECK

  # =============================================================
  # DATABAS
  # =============================================================
  # TODO: Konfigurera MariaDB                                                    CHECK     
  # - Använd image mariadb:10
  # - Sätt MYSQL_ROOT_PASSWORD och MYSQL_DATABASE
  # - Montera init.sql till /docker-entrypoint-initdb.d/
  # - Anslut ENBART till backend-nätverket (ej frontend!)
  # - Lägg till healthcheck
  # - Använd named volume för datalagring
  # =============================================================
  mariadb:
    image: mariadb:10
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: kabelkramarna123
      MYSQL_DATABASE: appdb
    volumes:
     - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:repo
     - mariadb_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      

    # TODO: Lägg till environment, volumes, networks, healthcheck                   CHECK

# =============================================================
# NÄTVERK
# =============================================================
# TODO: Definiera två nätverk:                                                      CHECK
# - frontend: bridge-nätverk med IPAM-subnet 172.20.0.0/24
# - backend: bridge-nätverk (ingen IPAM krävs)
#
# Tänk på: Vilka tjänster ska vara på vilka nätverk?
# Databasen ska INTE vara nåbar från lastbalanseraren.
# =============================================================
networks:
  backend:
    driver: bridge

  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
# =============================================================
# VOLYMER
# =============================================================
# TODO: Definiera named volume för databaslagring och init.sql                      CHECK
# =============================================================
volumes:
  mariadb_data:
